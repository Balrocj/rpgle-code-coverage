    <!-- Símbolo de código -->
    <text x="12" y="9" text-anchor="middle" fill="white" font-family="monospace" font-size="8" font-weight="bold">RPG</text>
    
    <!-- Barra de progreso -->
    <rect x="4" y="14" width="16" height="3" rx="1" fill="#E3F2FD"/>
